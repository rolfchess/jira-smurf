# Example planning configuration for `jira_smurf.py gantt`.
# Copy this file to gantt.toml and change it to match your team and project.

start_date = "2026-01-05"       # first day of the planning, YYYY-MM-DD
default_hours = 40              # hours for stories without story point estimates
velocity = 8.0                  # hours per story point
include_open_sprints = false    # also add all stories in the active sprint
include_future_sprints = false  # also add all stories in future sprints
work_starts_at = "In Progress"  # a done story's bar starts at this status or a later one
use_backlog_order = true        # plan stories in Jira backlog order, not in the order of this file
dependency_links = ["Blocks"]   # Jira link types that make a story wait for another

# These are days off for the whole team, written as YYYY-MM-DD.
holidays = [
    "2026-01-01",  # New Year's Day
    "2026-04-06",  # Easter Monday
    "2026-04-27",  # King's Day
    "2026-05-14",  # Ascension Day
    "2026-05-25",  # Whit Monday
    "2026-12-25",  # Christmas Day
    "2026-12-26",  # Boxing Day
    "2027-01-01",  # New Year's Day
    "2027-03-29",  # Easter Monday
    "2027-04-27",  # King's Day
    "2027-05-06",  # Ascension Day
    "2027-05-17",  # Whit Monday
    "2027-12-25",  # Christmas Day
    "2027-12-26",  # Boxing Day
]

[team]
# Each member has hours per weekday. The name must match the display name in Jira.
# Set auto_assign = false to keep a member out of auto-assigning. Such a member may have no hours.
# List vacation days and other days off in days_off, as YYYY-MM-DD. The member works 0 hours on those days.
# Write "YYYY-MM-DD to YYYY-MM-DD" for a range. A range includes both days.
# List the periods a member is in the team in in_team. Leave a side empty for an open end:
# "2026-09-01 to" has no end, and "to 2026-06-30" has no start. Without in_team, the member is
# always in the team.
[team."Alice Baker"]
mon = 8
tue = 8
wed = 8
thu = 8
fri = 6
days_off = ["2026-02-16", "2026-07-20 to 2026-08-07"]

[team."Bob Carter"]
mon = 8
tue = 8
wed = 0
thu = 8
fri = 8
in_team = ["to 2026-06-30", "2026-09-01 to"]   # left the team for the summer

[team."Carol Dixon"]
mon = 4
tue = 4
wed = 4
thu = 4
fri = 4
auto_assign = false

[statuses]
# Progress in percent for each Jira status. A story at 100 is done.
"To Do" = 0
"Refinement" = 1
"Ready for Development" = 5
"In Progress" = 20
"Blocked" = 0
"Code Review" = 80
"Done" = 100

[status_colors]
# This setting is optional. Stories with one of these Jira statuses get this background color on their row.
"Blocked" = "#ffcccc"

[epics]
# All stories of these epics are planned, in this order.
[epics.ACME-100] # Customer sign-up
[epics.ACME-200] # Invoice export

[stories]
# Single stories to plan, outside the epics above.
[stories.ACME-310] # Fix login timeout

[stories.ACME-320] # Add audit log
depends_on = ["ACME-310"]   # optional: the story starts after the listed stories finish
