# Example configuration for `jira_smurf.py gantt`.
# Copy this file to gantt.toml, then adapt it to your project and team.

start_date = "2026-01-05"       # first day in the plan, YYYY-MM-DD
default_hours = 40              # estimate for stories without points
velocity = 8.0                  # hours per story point
include_open_sprints = false    # include every story in the active sprint
include_future_sprints = false  # include every story in future sprints
work_starts_at = "In Progress"  # start completed work at this status or a later one
implementation_status = "Implementation"  # track time spent at this status or later
use_backlog_order = true        # use Jira backlog order instead of the order below
dependency_links = ["Blocks"]   # Jira link types treated as dependencies
auto_assign = true              # set false to put unassigned work under "Unassigned"
exclude = []                    # omit project keys or issue keys, such as "DTICARCH" or "ACME-123"

# Days on which the whole team is unavailable, in YYYY-MM-DD format.
holidays = [
    "2026-01-01",  # New Year's Day
    "2026-04-06",  # Easter Monday
    "2026-04-27",  # King's Day
    "2026-05-14",  # Ascension Day
    "2026-05-25",  # Whit Monday
    "2026-12-25",  # Christmas Day
    "2026-12-26",  # Boxing Day
    "2027-01-01",  # New Year's Day
    "2027-03-29",  # Easter Monday
    "2027-04-27",  # King's Day
    "2027-05-06",  # Ascension Day
    "2027-05-17",  # Whit Monday
    "2027-12-25",  # Christmas Day
    "2027-12-26",  # Boxing Day
    "2028-01-01",  # New Year's Day
    "2028-04-17",  # Easter Monday
    "2028-04-27",  # King's Day
    "2028-05-25",  # Ascension Day
    "2028-06-05",  # Whit Monday
    "2028-12-25",  # Christmas Day
    "2028-12-26",  # Boxing Day
]

[team]
# Use each member's Jira display name and set their hours per weekday.
# Set auto_assign = false to exclude a member from automatic assignment. Hours are then optional.
# In days_off, use YYYY-MM-DD or an inclusive "YYYY-MM-DD to YYYY-MM-DD" range.
# In in_team, list membership periods. Leave either date open when needed: "2026-09-01 to" or
# "to 2026-06-30". Without in_team, the member is always part of the team.
[team."Alice Baker"]
mon = 8
tue = 8
wed = 8
thu = 8
fri = 6
days_off = ["2026-02-16", "2026-07-20 to 2026-08-07"]

[team."Bob Carter"]
mon = 8
tue = 8
wed = 0
thu = 8
fri = 8
in_team = ["to 2026-06-30", "2026-09-01 to"]   # away for the summer

[team."Carol Dixon"]
mon = 4
tue = 4
wed = 4
thu = 4
fri = 4
auto_assign = false

[statuses]
# Map Jira statuses to progress percentages. A story at 100 is done.
"To Do" = 0
"Refinement" = 1
"Ready for Development" = 5
"In Progress" = 20
"Implementation" = 40
"Blocked" = 0
"Code Review" = 80
"Done" = 100

[status_colors]
# Optional row colors for selected Jira statuses.
"Blocked" = "#ffcccc"

[visuals]
# Optional display settings. Omitted values use their defaults.
past_due_blink = true         # blink the outline of overdue stories and epics
past_due_color = "#d62728"    # CSS color of the overdue outline; defaults to red
behind_baseline_color = "#f2c200"  # CSS color of the outline of a story behind the baseline; defaults to yellow

# Optional: add one [[badges]] table for each Jira field to mark on epics.
# Field IDs vary by Jira site. Find the field under Jira settings → Issues → Custom fields.
# An URL ending in id=10410 identifies customfield_10410. You can also use /rest/api/3/field.
[[badges]]
field = "customfield_10410"  # required Jira field ID
label = "Paid"               # optional label; defaults to the field value
color = "#d9a520"            # optional CSS color; defaults to amber
stripe = true                # also mark the left edge of the epic row
values = ["Yes"]             # optional matching values; by default, any value except "No", "False", or 0

[epics]
# Include every story in these epics, in this order.
[epics.ACME-100] # Customer sign-up
[epics.ACME-200] # Invoice export

[stories]
# Include individual stories outside the epics above.
[stories.ACME-310] # Fix login timeout

[stories.ACME-320] # Add audit log
depends_on = ["ACME-310"]   # wait until these stories are finished
